<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>شجرہ نسب خاندان امیر خان</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Nastaliq+Urdu:wght@400;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Symbols+2&text=%E2%9A%AD&display=swap" rel="stylesheet">
<style id="css">:root{
  /* Layout: one-screen app. Header, view tabs, then a pan/zoom canvas; a person sheet slides up over it (side panel on wide screens). Palette borrows the cool grey of the photocopied chart, with ink lines and amber for names still to check. */
  --paper:#E9EDEA;
  --card:#FAFBF9;
  --ink:#18201C;
  --muted:#5A6660;
  --line:#7F8B85;
  --accent:#1D5E62;
  --accent-weak:#D3E5E3;
  --check:#8A5300;
  --check-bg:#FCEFD2;
  --check-line:#D99A2B;
  --danger:#A3352B;
  --shadow:0 1px 2px rgba(20,30,25,.08),0 2px 8px rgba(20,30,25,.06);
  --font-urdu:"Noto Nastaliq Urdu","Jameel Noori Nastaleeq","Urdu Typesetting",serif;
  --font-ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-ui-ar:"IBM Plex Sans Arabic","Noto Naskh Arabic","Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#121715;--card:#1C2320;--ink:#E4EAE6;--muted:#9AA7A0;--line:#5F6C66;
    --accent:#79B9B5;--accent-weak:#203A39;--check:#F0BE5C;--check-bg:#3A2E15;--check-line:#C48F2A;--danger:#E2796E;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 2px 10px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#121715;--card:#1C2320;--ink:#E4EAE6;--muted:#9AA7A0;--line:#5F6C66;
  --accent:#79B9B5;--accent-weak:#203A39;--check:#F0BE5C;--check-bg:#3A2E15;--check-line:#C48F2A;--danger:#E2796E;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 2px 10px rgba(0,0,0,.3);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--font-ui);font-size:14px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ur{font-family:var(--font-urdu);direction:rtl}
#app{height:100%;display:flex;flex-direction:column}

/* header */
.top{padding:10px 16px 8px;display:grid;gap:6px;border-bottom:1px solid color-mix(in srgb,var(--line) 35%,transparent)}
.titlerow{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.title{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;direction:rtl}
.title h1{margin:0;font-family:var(--font-urdu);font-weight:600;font-size:24px;line-height:1.7;text-wrap:balance}
.title .sub{font-family:var(--font-urdu);font-size:15px;line-height:1.9;color:var(--muted)}
.stats{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;border:1px solid transparent;font-size:12.5px;font-weight:500;cursor:pointer;background:transparent}
.chip.check{background:var(--check-bg);color:var(--check);border-color:color-mix(in srgb,var(--check-line) 55%,transparent)}
.chip.check::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--check-line)}
.status{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.status::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--line)}
.status.ok::before{background:var(--accent)}
.status.busy::before{background:var(--check-line)}
.status.warn{color:var(--check)}
.status.warn::before{background:var(--check-line)}

/* tabs + toolbar */
.bar{display:flex;gap:8px;align-items:center;padding:8px 16px;flex-wrap:wrap}
.tabs{display:inline-flex;background:color-mix(in srgb,var(--line) 18%,transparent);border-radius:9px;padding:3px;gap:2px}
.tabs button{border:0;background:transparent;padding:6px 12px;border-radius:7px;font-weight:500;font-size:13px;cursor:pointer;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.search{position:relative;flex:1 1 180px;min-width:150px}
.search input{width:100%;border:1px solid color-mix(in srgb,var(--line) 55%,transparent);background:var(--card);border-radius:9px;padding:7px 10px;font-family:var(--font-ui-ar);font-size:14px;direction:rtl}
.search input::placeholder{color:var(--muted);font-family:var(--font-ui);direction:ltr;text-align:right}
.results{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--card);border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.18);max-height:min(60vh,420px);overflow:auto;z-index:30;padding:4px;display:none}
.results.on{display:block}
.results button{display:block;width:100%;text-align:right;direction:rtl;border:0;background:transparent;border-radius:7px;padding:4px 10px;cursor:pointer}
.results button:hover,.results button:focus-visible{background:var(--accent-weak)}
.results .rn{font-family:var(--font-urdu);font-size:15px;line-height:1.9}
.results .rl{font-family:var(--font-ui-ar);font-size:12px;color:var(--muted)}
.results .none{padding:10px;color:var(--muted);font-size:13px}
.btn{border:1px solid color-mix(in srgb,var(--line) 55%,transparent);background:var(--card);border-radius:9px;padding:6px 11px;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--card)}
.btn.danger{color:var(--danger)}
.btn.small{padding:4px 9px;font-size:12.5px}

/* views */
.views{position:relative;flex:1;min-height:0}
.view{position:absolute;inset:0;display:none}
.view.on{display:block}
.canvas{position:absolute;inset:0;overflow:hidden;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.canvas.drag{cursor:grabbing}
.world{position:absolute;left:0;top:0;transform-origin:0 0}
.world svg{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.world path{fill:none;stroke:var(--line);stroke-width:1.4;stroke-linejoin:round}
.zoom{position:absolute;right:16px;bottom:16px;display:flex;flex-direction:column;gap:6px;z-index:5}
.zoom button{width:38px;height:38px;border-radius:10px;border:1px solid color-mix(in srgb,var(--line) 55%,transparent);background:var(--card);box-shadow:var(--shadow);font-size:18px;cursor:pointer;line-height:1}
.zoom button.fit{font-size:11px;font-weight:600}

/* person card in the tree */
.node{position:absolute;left:0;top:0;background:var(--card);border:1px solid color-mix(in srgb,var(--line) 60%,transparent);border-radius:8px;padding:2px 8px 6px;text-align:center;box-shadow:var(--shadow);cursor:pointer}
.node .nm{font-family:var(--font-urdu);font-size:15px;line-height:2.05;direction:rtl}
.node .sp{font-family:var(--font-ui-ar);font-size:11.5px;line-height:1.5;color:var(--muted);direction:rtl;margin-top:-2px}
.ring{font-family:"Noto Sans Symbols 2","Segoe UI Symbol",var(--font-ui);font-size:12px;opacity:.85}
.node.q{background:var(--check-bg);border-color:var(--check-line);border-inline-end:4px solid var(--check-line)}
.node.blank .nm{color:var(--check);font-family:var(--font-ui-ar);font-size:12px;line-height:2.4}
.node.sel{outline:2.5px solid var(--accent);outline-offset:2px}
.node.hit{box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 35%,transparent)}
.node.d1 .nm,.node.d2 .nm{font-weight:600;font-size:16px}
.tg{position:absolute;left:50%;bottom:-11px;transform:translateX(-50%);min-width:26px;height:20px;padding:0 7px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:11px;font-weight:600;color:var(--accent);cursor:pointer;line-height:18px;font-variant-numeric:tabular-nums}
.tg.closed{background:var(--accent);border-color:var(--accent);color:var(--card)}

/* list view */
.list{position:absolute;inset:0;overflow:auto;padding:8px 16px 96px;direction:rtl}
.list ul{list-style:none;margin:0;padding:0}
.list ul ul{margin-inline-start:13px;padding-inline-start:10px;border-inline-start:1px solid color-mix(in srgb,var(--line) 55%,transparent)}
.lrow{display:flex;align-items:center;gap:8px;padding:1px 4px;border-radius:8px;cursor:pointer;min-height:40px}
.lrow:hover{background:color-mix(in srgb,var(--accent-weak) 60%,transparent)}
.lrow.sel{background:var(--accent-weak)}
.lrow .tw{width:24px;height:24px;flex:none;border:0;background:transparent;border-radius:6px;cursor:pointer;color:var(--accent);font-size:13px;display:grid;place-items:center}
.lrow .tw.leaf{visibility:hidden}
.lrow .nm{font-family:var(--font-urdu);font-size:16px;line-height:2.1}
.lrow.q .nm{color:var(--check)}
.lrow.q .nm::after{content:" ؟";font-family:var(--font-ui-ar);font-size:13px}
.lrow.blank .nm{font-family:var(--font-ui-ar);font-size:13px;line-height:2;color:var(--check)}
.lrow .sp{font-family:var(--font-ui-ar);font-size:12.5px;color:var(--muted)}
.lrow .ct{font-family:var(--font-ui);font-size:11.5px;color:var(--muted);direction:ltr;font-variant-numeric:tabular-nums;margin-inline-start:auto}
.listtools{display:flex;gap:8px;flex-wrap:wrap;padding:6px 0 10px;direction:ltr}

/* photo */
.photo-note{position:absolute;left:16px;right:70px;bottom:16px;z-index:5;font-size:12.5px;color:var(--muted);background:color-mix(in srgb,var(--card) 88%,transparent);border-radius:9px;padding:7px 10px;max-width:420px}
.world img{display:block;max-width:none;border-radius:4px;box-shadow:var(--shadow)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,15,12,.25);z-index:40;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:72%;overflow:auto;background:var(--card);border-radius:16px 16px 0 0;box-shadow:0 -6px 30px rgba(0,0,0,.18);z-index:50;padding:8px 18px 22px;transform:translateY(105%);transition:transform .22s ease}
.sheet.on{transform:none}
.sheet.on+.scrim{display:block}
.grab{width:40px;height:4px;border-radius:2px;background:color-mix(in srgb,var(--line) 60%,transparent);margin:2px auto 8px}
.shead{display:flex;align-items:flex-start;gap:10px}
.shead .who{flex:1;direction:rtl;text-align:right}
.shead h2{margin:0;font-family:var(--font-urdu);font-size:24px;font-weight:600;line-height:1.95}
.shead h2.blank{font-family:var(--font-ui-ar);font-size:17px;line-height:1.8;color:var(--check)}
.shead .sp{font-family:var(--font-ui-ar);font-size:14px;color:var(--muted)}
.close{border:0;background:color-mix(in srgb,var(--line) 18%,transparent);width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:16px;flex:none}
.meta{color:var(--muted);font-size:12.5px;margin:4px 0 10px;font-variant-numeric:tabular-nums}
.callout{background:var(--check-bg);border:1px solid color-mix(in srgb,var(--check-line) 60%,transparent);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:13px;display:grid;gap:8px;margin-bottom:12px}
.callout .acts{display:flex;gap:8px;flex-wrap:wrap}
.sec{margin:12px 0}
.sec h3{margin:0 0 6px;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;direction:rtl}
.pchip{border:1px solid color-mix(in srgb,var(--line) 50%,transparent);background:transparent;border-radius:999px;padding:0 11px;font-family:var(--font-urdu);font-size:14px;line-height:2.1;cursor:pointer}
.pchip.q{border-color:var(--check-line);color:var(--check)}
.pchip.cur{background:var(--accent-weak);border-color:var(--accent)}
.lineage{display:flex;flex-wrap:wrap;gap:4px 2px;align-items:center;direction:rtl}
.lineage .arr{color:var(--muted);font-size:12px;padding:0 2px}
.note{direction:rtl;text-align:right;font-family:var(--font-ui-ar);font-size:13.5px;background:color-mix(in srgb,var(--line) 10%,transparent);border-radius:8px;padding:8px 10px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.form{display:grid;gap:10px}
.form label{display:grid;gap:4px;font-size:12.5px;color:var(--muted);font-weight:500}
.form input[type=text],.form textarea{border:1px solid color-mix(in srgb,var(--line) 60%,transparent);background:var(--paper);border-radius:9px;padding:6px 10px;font-family:var(--font-ui-ar);font-size:15px;direction:rtl;color:var(--ink)}
.form textarea{min-height:60px;resize:vertical}
.form .cb{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink)}
.confirm{border:1px solid color-mix(in srgb,var(--danger) 45%,transparent);border-radius:10px;padding:10px 12px;display:grid;gap:8px;font-size:13px}
.ro .edit-only{display:none!important}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:9px;font-size:13px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
@media (min-width:960px){
  .sheet{left:auto;top:0;right:0;width:380px;max-height:none;height:100%;border-radius:0;transform:translateX(105%);box-shadow:-6px 0 30px rgba(0,0,0,.14);padding-top:16px}
  .sheet.on+.scrim{display:none}
  .grab{display:none}
  .views.withsheet .zoom{right:396px}
}
@media (prefers-reduced-motion: reduce){.sheet,.toast{transition:none}}

/* language switch + English names */
.langs button{padding:5px 10px}
.langs button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.lang-en .title{direction:ltr}
.title h1.en-h{font-family:var(--font-ui);font-size:20px;font-weight:600;line-height:1.35}
.title .sub.en{font-family:var(--font-ui);font-size:13.5px;line-height:1.4;direction:ltr}
.node .en-nm{font-family:var(--font-ui);font-size:13px;font-weight:600;line-height:1.3;padding:6px 0 3px}
.node.blank .en-nm{color:var(--check);font-weight:500;font-size:12px}
.node .en-sub{font-family:var(--font-ui);font-size:11px;line-height:1.3;opacity:.8;margin:-4px 0 3px}
.node .sp-en{font-family:var(--font-ui);font-size:11px;line-height:1.35;color:var(--muted)}
.lang-en .list{direction:ltr}
.lang-en .lrow{min-height:36px}
.lang-en .lrow .nm{font-family:var(--font-ui);font-size:14.5px;line-height:1.5;font-weight:500}
.lang-en .lrow.blank .nm{font-family:var(--font-ui);font-size:13px}
.lang-en .lrow.q .nm::after{content:" ?";font-family:var(--font-ui)}
.lang-en .lrow .sp{font-family:var(--font-ui)}
.lrow .en-sub{font-family:var(--font-ui);font-size:12.5px;opacity:.75;direction:ltr}
.lang-en .chips,.lang-en .lineage{direction:ltr}
.lang-en .pchip{font-family:var(--font-ui);font-size:13px;line-height:1.9}
.lang-en .results button{direction:ltr;text-align:left}
.lang-en .results .rn{font-family:var(--font-ui);font-size:14px;line-height:1.6;font-weight:500}
.lang-en .results .rl,.results .rl[lang="en"]{font-family:var(--font-ui)}
.lang-en .search input{direction:ltr;font-family:var(--font-ui)}
.lang-en .search input::placeholder{text-align:left}
.shead .who.is-en{direction:ltr;text-align:left}
.shead .who.is-en h2{font-family:var(--font-ui);font-size:21px;line-height:1.35;padding-top:4px}
.shead .who.is-en h2.blank{font-size:17px}
.shead .alt.ur{font-family:var(--font-urdu);font-size:16px;line-height:2.1;color:var(--muted)}
.shead .who.is-en .alt.ur{text-align:left}
.shead .alt.en{font-family:var(--font-ui);font-size:14px;line-height:1.4;color:var(--muted);direction:ltr;text-align:right;margin-top:-4px}
.shead .sp{direction:ltr}
.shead .who:not(.is-en) .sp{direction:rtl}
.shead .sp .ur{font-family:var(--font-ui-ar)}
.note.en{direction:ltr;text-align:left;font-family:var(--font-ui)}
.form .pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form input.ltr{direction:ltr;font-family:var(--font-ui)}
@media (max-width:440px){.form .pair{grid-template-columns:1fr}}
</style>
</head>

  else if (act === 'edit') { ui.mode = 'edit'; renderSheet(); }
  else if (act === 'add') { ui.mode = 'add'; renderSheet(); }
  else if (act === 'del') { ui.mode = 'confirm'; renderSheet(); }
  else if (act === 'delyes') {
    var p = parentOf.get(n.id); p.c.splice(p.c.indexOf(n), 1); commit(); ui.sel = p.id; ui.mode = 'view'; refresh(); renderSheet(); toast('Deleted');
  }
  else if (act === 'ok') { n.q = false; commit(); refresh(); renderSheet(); toast('Marked as checked'); }
  else if (act === 'next') {
    var list = toCheck(), i = order.indexOf(n), nx = null;
    for (var j = 1; j <= order.length; j++) { var c = order[(i + j) % order.length]; if (c.q && c !== n) { nx = c; break; } }
    if (nx) goTo(nx.id); else toast('Nothing else to check');
  }
  else if (act === 'photo') { setView('photo'); }
  else if (act === 'up' || act === 'down') {
    var par = parentOf.get(n.id), k = par.c.indexOf(n), to = act === 'up' ? k - 1 : k + 1;
    if (to < 0 || to >= par.c.length) return;
    par.c.splice(k, 1); par.c.splice(to, 0, n); commit(); refresh(); renderSheet();
  }
});
function refresh(){
  renderStats();
  if (ui.view === 'tree') renderTree(); else if (ui.view === 'list') renderList();
  if (ui.sel) { var n = byId.get(ui.sel); if (n && n._el && n._el.isConnected) n._el.classList.add('sel'); }
}

/* ---------- language ---------- */
function renderTitle(){
  var t = $('#title');
  if (isEn()) t.innerHTML = '<h1 class="en-h" lang="en">Family Tree</h1><span class="sub en" lang="en">Amir Khan, son of Kale Khan</span>';
  else t.innerHTML = '<h1 lang="ur">شجرہ نسب</h1><span class="sub" lang="ur">خاندان امیر خان ولد کالے خان</span>' + (ui.lang === 'both' ? '<span class="sub en" lang="en">Family of Amir Khan, son of Kale Khan</span>' : '');
  document.querySelectorAll('.langs button').forEach(function(b){ b.setAttribute('aria-pressed', b.dataset.lang === ui.lang ? 'true' : 'false'); });
  document.body.classList.remove('lang-en', 'lang-ur', 'lang-both'); document.body.classList.add('lang-' + ui.lang);
}
function setLang(l){
  if (l === ui.lang) return;
  var anchor = ui.sel || DATA.root.id, p0 = ui.view === 'tree' ? nodePos(anchor) : null, sc = p0 && ui.tree.screenOf(p0.x + W / 2, p0.y);
  ui.lang = l;
  try { localStorage.setItem(LANG_KEY, l); } catch (e) {}
  renderTitle();
  if (ui.view === 'tree') { renderTree(); var p1 = nodePos(anchor); if (p0 && p1) ui.tree.keepAt(p1.x + W / 2, p1.y, sc.x, sc.y); }
  else if (ui.view === 'list') renderList();
  if (sheet.classList.contains('on') && ui.sel) renderSheet();
}
document.querySelectorAll('.langs button').forEach(function(b){ b.onclick = function(){ setLang(b.dataset.lang); }; });

/* ---------- stats ---------- */
function renderStats(){
  var c = toCheck().length;
  $('#stats').innerHTML = '<span>' + order.length + ' people · ' + maxDepth() + ' generations</span>' +
    (c ? '<button class="chip check" id="tocheck">' + c + ' names to check</button>' : '<span class="chip" style="background:var(--accent-weak);color:var(--accent)">All names checked</span>');
  var t = $('#tocheck');
  if (t) t.onclick = function(){ var f = toCheck()[0]; if (f) goTo(f.id); };
}

/* ---------- saving ---------- */
var cap, readOnly = false, saveT = null, pending = false;
function setStatus(kind, text){ var s = $('#status'); s.className = 'status ' + (kind || ''); s.textContent = text || ''; }
function commit(){ DATA.rev = (DATA.rev || 0) + 1; index(); pending = true; clearTimeout(saveT); setStatus('busy', 'Saving…'); saveT = setTimeout(save, 1200); }
function serial(){ return JSON.stringify(DATA, function(k, v){ return k.charAt(0) === '_' ? undefined : v; }); }
function buildDoc(){
  var css = document.getElementById('css').textContent, photo = document.getElementById('photo').textContent, main = document.getElementById('main').textContent;
  return '<!DOCTYPE html>\n<html lang="en">\n<head>\n' + HEAD + '<style id="css">' + css + '</style>\n</head>\n<body>\n<div id="app"></div>\n' +
    '<script type="application/json" id="data">' + serial().replace(/</g, '\\u003c') + '<\/script>\n' +
    '<script type="text/plain" id="photo">' + photo + '<\/script>\n' +
    '<script id="main">' + main + '<\/script>\n</body>\n</html>\n';
}
function saveLocal(){ try { localStorage.setItem(LS_KEY, serial()); return true; } catch (e) { return false; } }
function saveUI(){ try { sessionStorage.setItem(SS_KEY, JSON.stringify({ view: ui.view, open: Array.from(ui.open), sel: ui.sel, lang: ui.lang, saved: true })); } catch (e) {} }
function save(){
  if (!pending) return;
  if (cap === undefined) return; // waits for the page's save ability to answer
  pending = false;
  if (!cap || readOnly) { var ok = saveLocal(); setStatus('warn', ok ? 'Edits kept in this browser only' : 'Edits will be lost on reload'); return; }
  saveUI();
  cap.publish(buildDoc()).then(function(){ setStatus('ok', 'Saved'); }, function(err){
    var m = String((err && (err.code || err.message)) || err || '');
    if (/not_granted|not_writer/.test(m)) { readOnly = true; document.body.classList.add('ro'); saveLocal(); setStatus('warn', 'View only · edits kept in this browser'); }
    else if (/conflict/.test(m)) setStatus('warn', 'Someone else saved first · reloading');
    else { saveLocal(); setStatus('warn', 'Could not save · kept in this browser'); }
  });
}
function initSave(){
  if (!(window.claude && typeof window.claude.use === 'function')) { cap = null; readOnly = true; document.body.classList.add('ro'); setStatus('', 'View only'); return; }
  window.claude.use('artifact').then(function(a){ cap = a || null; afterCap(); }, function(){ cap = null; afterCap(); });
}
function afterCap(){
  if (pending) save();
  else if (restored && restored.saved) setStatus('ok', 'Saved');
  else if (cap) setStatus('ok', 'Auto-saves');
  else setStatus(localOnly ? 'warn' : '', localOnly ? 'Showing edits from this browser' : 'Edits stay in this browser');
}

/* ---------- start ---------- */
renderTitle();
renderStats();
syncExpand();
setView(ui.view);
if (ui.view === 'tree') initialView();
if (ui.sel) { select(ui.sel); if (ui.view === 'tree') focusTree(ui.sel); else if (ui.view === 'list') focusList(ui.sel); }
initSave();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(function(){
  if (ui.view === 'tree') {
    var anchor = ui.sel || DATA.root.id, p0 = nodePos(anchor), sc = p0 && ui.tree.screenOf(p0.x, p0.y);
    renderTree();
    var p1 = nodePos(anchor);
    if (p0 && p1) ui.tree.keepAt(p1.x, p1.y, sc.x, sc.y);
    if (!ui.sel && !restored) initialView();
  }
});
var lastW = window.innerWidth;
window.addEventListener('resize', function(){ if (window.innerWidth !== lastW && ui.view === 'tree' && !ui.sel) initialView(); lastW = window.innerWidth; });
})();
</script>
</body>
